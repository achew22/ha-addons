name: fb-reader
version: "0.2.1"
slug: fb_reader
description: Reads the newest post from public Facebook pages into sensors
url: https://github.com/achew22/ha-addons/tree/main/fb_reader
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
homeassistant_api: true
options:
  schedule: "*/30 * * * *"
  pages:
    - page: 1884FunctionalFitness
schema:
  schedule: match(^[0-9*/,-]+( [0-9*/,-]+){4}$)
  pages:
    - page: str
      token: password?
      sensor: str?
